<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Mon calendrier</title>
<link rel="icon" type="image/png" href="logog2.png">
<style>
:root{--font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--ink:#112336;--muted:#586a7e;--line:#d8e1ea;--line-soft:#e9eff5;--field:#f6f9fc;--primary:#0b6fa4;--primary-d:#085a86;--primary-soft:#e3f1f9;--late:#b92a30;--late-soft:#fdecec;--ok:#16784a;--ok-soft:#e1f4e9;--shadow:0 1px 2px rgba(17,35,54,.05),0 8px 24px rgba(17,35,54,.1);--ring:0 0 0 4px rgba(11,111,164,.15)}
.s-pris{--c:#0b6fa4;--bg:#e3f1f9}.s-attente{--c:#a35a00;--bg:#ffefc7}.s-encours{--c:#6b3fc4;--bg:#ece5fb}.s-termine{--c:#16784a;--bg:#e1f4e9}.s-annule{--c:#b92a30;--bg:#fdecec}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;font-family:var(--font);font-size:16px;line-height:1.45;color:var(--ink);background:#fff}
h1,h2,p{margin:0}
header{flex:none;display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 20px;border-bottom:1px solid var(--line)}
.brand{width:38px;height:38px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--primary),var(--primary-d));border-radius:11px}
.brand svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.kicker{font-size:12px;font-weight:600;color:var(--muted)}h1{font-size:18px;font-weight:700}
#who{margin-left:auto;font-size:14px;font-weight:600;color:var(--muted)}
main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding:12px clamp(12px,2.5vw,28px) 14px}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
.tools,.legend{flex:none}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
#titre{font-size:18px;font-weight:700;text-transform:capitalize;min-width:200px}
button{font:inherit}
.b{min-height:40px;padding:0 14px;font-weight:600;font-size:14px;color:var(--primary);background:#fff;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.b:hover{background:var(--primary-soft)}.b.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.seg{display:flex}.seg .b:first-child{border-radius:10px 0 0 10px}.seg .b:last-child{border-radius:0 10px 10px 0;margin-left:-1px}
input[type=date]{min-height:40px;padding:0 10px;font:500 14px var(--font);border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--c);background:var(--bg);border:2px solid transparent;border-radius:999px;cursor:pointer}
.chip::before,.pill::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed=false]{background:#fff;border-color:var(--line);color:var(--muted);text-decoration:line-through}
.chip[aria-pressed=false]::before{background:var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;font-size:12px;font-weight:700;border-radius:999px;white-space:nowrap;color:var(--c);background:var(--bg)}
#wrap{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:14px}
#cal{display:grid;min-width:100%}
.gh{position:sticky;top:0;z-index:5;padding:8px 4px;text-align:center;font-size:13px;font-weight:600;color:var(--muted);background:#fff;border-bottom:1px solid var(--line);border-left:1px solid var(--line-soft);text-transform:capitalize}
.gh b{display:block;font-size:20px;color:var(--ink);line-height:1.2}
.gh.today b{display:inline-grid;place-items:center;min-width:34px;height:34px;color:#fff;background:var(--primary);border-radius:50%}
.gut{position:relative;background:#fff;position:sticky;left:0;z-index:4}
.gut span{position:absolute;right:8px;font-size:12px;color:var(--muted);transform:translateY(-50%)}
.col{position:relative;border-left:1px solid var(--line-soft);background-image:linear-gradient(var(--line-soft) 1px,transparent 1px)}
.col.today{background-color:#f8fbfe}
.ev{position:absolute;display:block;overflow:hidden;padding:2px 6px;text-align:left;font-size:12px;line-height:1.3;color:var(--ink);white-space:nowrap;text-overflow:ellipsis;background:var(--bg);border:0;border-left:5px solid var(--c);border-radius:6px;cursor:pointer;z-index:2}
.ev:hover{filter:brightness(.96)}.ev b{color:var(--c)}.ev small{color:var(--muted)}
.ev{touch-action:manipulation;user-select:none}h3{margin:16px 0 0;font-size:15px}
.ev.s-attente{box-shadow:0 0 0 2px var(--c) inset;font-weight:600}
.ev.s-encours{background:var(--c);color:#fff}.ev.s-encours b,.ev.s-encours small{color:#fff}
.ev.s-annule{background:repeating-linear-gradient(135deg,var(--bg),var(--bg) 5px,#fff 5px,#fff 10px);color:var(--muted);border-left:5px dashed var(--c);opacity:.8;z-index:0}
.ev.s-annule .nm{text-decoration:line-through}.ev.s-annule::after{content:"ⓘ";position:absolute;right:5px;top:2px;color:var(--c);font-weight:700}
.ev[aria-current=true]{outline:3px solid var(--ink);z-index:3}
.raison{margin-top:12px;padding:12px;border-radius:12px;background:var(--late-soft);border:1px dashed var(--late);color:var(--late);font-weight:600}
.raison small{display:block;font-weight:500;color:var(--muted);margin-top:4px}
.note{margin-top:14px;padding:12px;border-radius:12px;background:var(--bg);color:var(--c);font-weight:600}
.choice{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:8px;cursor:pointer;text-align:left}.choice input{margin-top:4px;width:auto;min-height:0}.choice.on{border-color:var(--primary);background:var(--primary-soft)}
.btn-primary:disabled{opacity:.45}.btn-danger:hover{background:var(--late-soft)}
.now{position:absolute;left:0;right:0;height:2px;background:#e0334a;z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:#e0334a}
.aff{position:absolute;left:0;right:0;z-index:0;pointer-events:none;overflow:hidden;padding:3px 6px;font-size:11px;font-weight:700;color:var(--muted);background:rgba(88,106,126,.09);border-left:4px solid #9aa9b8}
.aff.cs{color:#16784a;background:rgba(22,120,74,.10);border-left-color:#16784a}
.ev-srv{position:absolute;left:2px;right:2px;z-index:1;overflow:hidden;padding:3px 7px;text-align:left;font-size:12px;line-height:1.3;font-weight:600;color:#4c1d95;background:#ece5fb;border:0;border-left:5px solid #6b3fc4;border-radius:6px;cursor:pointer;white-space:nowrap;text-overflow:ellipsis}
.ev-srv:hover{filter:brightness(.96)}
.ev-srv.non{opacity:.45;text-decoration:line-through}
.ev-srv.att{background:#fff;outline:1.5px dashed #6b3fc4;outline-offset:-1.5px}
.rsvp-sum{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.rsvp-sum span{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--field)}
.warn-c{margin:10px 0 0;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:600;color:#a35a00;background:#ffefc7}
.btn-sec{appearance:none;min-height:40px;padding:0 14px;font:600 14px var(--font);border-radius:10px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--primary);margin-top:8px;width:100%;text-decoration:none;display:flex;align-items:center;justify-content:center}.btn-sec:hover{background:var(--primary-soft)}
.etat{padding:6px 12px;font-size:13px;font-weight:700;border-radius:999px;color:var(--muted);background:var(--line-soft)}.etat.cs{color:#16784a;background:#e1f4e9}.etat.oth{color:var(--primary-d);background:var(--primary-soft)}
#detail{position:fixed;top:0;right:0;bottom:0;z-index:50;width:min(440px,100%);padding:20px;overflow:auto;background:#fff;border-left:1px solid var(--line);box-shadow:var(--shadow)}
.dh{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-title{font-size:18px;font-weight:700}.x{width:36px;height:36px;font-size:22px;background:#fff;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.fact{padding:10px 12px;margin:10px 0 0;background:var(--field);border:1px solid var(--line-soft);border-radius:12px}
.fact label{display:block;font-size:13px;font-weight:600;color:var(--muted)}.fact span{font-weight:600;word-break:break-word}
.btn-primary,.btn-danger,.btn-ev{appearance:none;min-height:42px;padding:0 16px;font:600 14px/1 var(--font);border-radius:10px;cursor:pointer;border:1px solid var(--primary);margin-top:10px;width:100%}
.btn-primary{background:var(--primary);color:#fff}
.btn-ev{background:#6b3fc4;border-color:#6b3fc4;color:#fff}
.btn-danger{background:#fff;color:var(--late);border-color:#f0c3c5}
dialog{width:min(680px,calc(100% - 24px));max-height:calc(100% - 24px);padding:0;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);color:var(--ink)}
dialog::backdrop{background:rgba(17,35,54,.35)}
.db{padding:16px 20px;display:grid;gap:14px;overflow-y:auto;max-height:calc(100vh - 160px)}
.db label,.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,select,textarea{width:100%;min-height:40px;padding:0 12px;font:500 14.5px var(--font);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px}
textarea{min-height:74px;padding:10px 12px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--primary);box-shadow:var(--ring)}
.chk-inline{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;font-size:13.5px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;cursor:pointer;user-select:none}
.chk-inline:has(input:checked){background:var(--primary-soft);border-color:var(--primary);color:var(--primary-d)}
.chk-inline input{width:auto;min-height:0}

/* PRO ATTENDEE PICKER STYLES */
.attendee-box{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--field)}
.attendee-search{margin-bottom:8px}
.attendee-list{max-height:180px;overflow-y:auto;display:grid;gap:6px}
.attendee-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:10px;gap:8px}
.attendee-item:hover{border-color:var(--primary)}
.att-info{flex:1;min-width:0}
.att-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-sub{font-size:12px;color:var(--muted)}
.badge-status{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.badge-free{background:var(--ok-soft);color:var(--ok)}
.badge-busy{background:var(--late-soft);color:var(--late)}
.role-toggle{display:flex;gap:4px}
.role-btn{padding:4px 10px;font-size:12px;font-weight:600;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer}
.role-btn.active-mand{background:var(--primary);color:#fff;border-color:var(--primary)}
.role-btn.active-opt{background:#e3f1f9;color:var(--primary-d);border-color:var(--primary)}

.msg{padding:14px 16px;border-radius:12px;background:var(--late-soft);color:var(--late);font-weight:600}.mut{color:var(--muted)}
*{scrollbar-width:thin;scrollbar-color:rgba(11,111,164,.35) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(11,111,164,.35);border-radius:20px}
</style>
</head>
<body>
<header>
  <div class="brand"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M12 13v5M9.5 15.5h5"/></svg></div>
  <div><div class="kicker">Urgences · Mon calendrier</div><h1>Mon calendrier &amp; réunions</h1></div>
  <button class="btn-ev" id="bNewEv" style="width:auto;margin-left:12px;min-height:36px" hidden>+ Nouvelle réunion</button>
  <span id="who"></span>
</header>
<main>
  <div id="gate" class="msg">Connexion en cours…</div>
  <div id="app" hidden>
    <div class="tools">
      <button class="b" id="today">Aujourd’hui</button>
      <button class="b" id="prev" aria-label="Précédent">‹</button><button class="b" id="next" aria-label="Suivant">›</button>
      <span id="titre"></span><span id="etat" class="etat"></span>
      <input id="jour" type="date" aria-label="Aller à la date" style="margin-left:auto">
      <div class="seg"><button class="b" id="v-day">Jour</button><button class="b" id="v-week">Semaine</button></div>
    </div>
    <div class="legend" id="legend"></div>
    <div id="wrap"><div id="cal"></div></div>
  </div>
</main>
<aside id="detail" hidden></aside>

<!-- La modale de réunion est fournie par reunions.js -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initReunions, quand, premiereDate, resumeRSVP, ics, applique as appliqueEv, CATS as CATS_EV, MODES as MODES_EV } from "./reunions.js";
import { getFirestore, doc, getDoc, getDocs, addDoc, updateDoc, collection, query, where, limit, onSnapshot, runTransaction, serverTimestamp, Timestamp, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBKp5-7NNy0Gyl0tNbDgD-BxucYdg8ArWo",authDomain:"urgences-a8ed4.firebaseapp.com",projectId:"urgences-a8ed4"});
const auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>{const z=new Date(d-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const STAT={pris:'Réservé',attente:"En salle d'attente",encours:'En consultation',termine:'Terminé',annule:'Annulé'};
const MODES={presentiel:'Sur place',distanciel:'En distanciel',hybride:'Hybride'};
const CATS={reunion:'Réunion',staff:'Staff / relève',formation:'Formation',autre:'Événement'};
const PX=120,DUR=15;
let medecin={},users=[],rdvs=[],allAffs=[],allEvts=[],affs=[],evts=[],unsubA=null,unsubE=null,sel=null,unsub=null,view=innerWidth<820?'day':'week',anchor=new Date(),hid=new Set(),go=true,editEvId=null;
const tm=h=>{const[a,b]=String(h).split(':');return +a*60+ +b};

const ORIGINE_PARENT_BULLE = "*";
const BULLE = {OK:"succes", ERR:"erreur", WARN:"avertissement", INFO:"info"};
function afficherBulle(message, typeBulle){
  if(window.parent === window){console.warn(message);return;}
  window.parent.postMessage({source:"notification-bulle", message, typeBulle}, ORIGINE_PARENT_BULLE);
}
window.afficherLoader=()=>{let l=document.getElementById("loadingScreen");if(!l){l=document.createElement("iframe");l.id="loadingScreen";l.src="loader.html?modal=true";l.style.cssText="position:fixed;top:0;left:0;width:100%;height:100%;border:none;z-index:9999;background:transparent;pointer-events:none";document.body.appendChild(l)}l.style.display="block";l.style.opacity="1"};
window.masquerLoader=()=>{const l=document.getElementById("loadingScreen");if(l){l.style.transition="opacity .3s";l.style.opacity="0";setTimeout(()=>l.style.display="none",300)}};

onAuthStateChanged(auth,async user=>{
  if(!user){$('#gate').textContent='Vous devez être connecté.';return}
  try{
    window.afficherLoader();
    const [s, uDocs, affSnap, evtSnap]=await Promise.all([
      getDoc(doc(db,"medecins",user.uid)), 
      getDocs(collection(db,'medecins')),
      getDocs(collection(db,'affectations')),
      getDocs(collection(db,'evenements'))
    ]);
    if(!s.exists()){window.masquerLoader();afficherBulle("Utilisateur non trouvé.", BULLE.ERR);return}
    const data=s.data();medecin={...data,uid:user.uid};
    users=uDocs.docs.map(d=>({uid:d.id,nom:d.data().nom||d.id,specialite:d.data().specialite||''})).sort((x,y)=>x.nom.localeCompare(y.nom,'fr'));
    allAffs=affSnap.docs.map(d=>d.data());
    allEvts=evtSnap.docs.map(d=>({id:d.id,...d.data()}));
    $('#who').textContent=data.nom||"";

    // Création de réunion réservée aux comptes ayant pages.creerRDV
    $('#bNewEv').hidden=!(data.pages&&data.pages.creerRDV===true);

    $('#gate').hidden=true;$('#app').hidden=false;
    ecouter();ecouterAffectations();window.masquerLoader();setTimeout(demandeWidget,0);
  }catch(e){window.masquerLoader();afficherBulle("Une erreur est survenue, veuillez réessayer.",BULLE.ERR);console.error(e)}
});

function plage(){
  const a=new Date(anchor);a.setHours(0,0,0,0);if(view==='day')return[a,a];
  const m=new Date(a);m.setDate(a.getDate()-((a.getDay()+6)%7));const e=new Date(m);e.setDate(m.getDate()+6);return[m,e];
}
const bouger=n=>{const d=new Date(anchor);d.setDate(d.getDate()+n*(view==='day'?1:7));anchor=d;ecouter()};
$('#prev').onclick=()=>bouger(-1);$('#next').onclick=()=>bouger(1);
$('#today').onclick=()=>{anchor=new Date();ecouter()};
$('#jour').onchange=e=>{if(e.target.value){anchor=new Date(e.target.value+'T12:00');ecouter()}};
$('#v-day').onclick=()=>{view='day';ecouter()};$('#v-week').onclick=()=>{view='week';ecouter()};
$('#legend').onclick=e=>{const c=e.target.closest('.chip');if(!c||!c.dataset.s)return;const s=c.dataset.s;hid.has(s)?hid.delete(s):hid.add(s);rendre()};

function ecouter(){
  if(unsub)unsub();go=true;
  const[a,b]=plage();
  $('#jour').value=iso(anchor);$('#v-day').classList.toggle('on',view==='day');$('#v-week').classList.toggle('on',view==='week');
  unsub=onSnapshot(query(collection(db,'rdv-urgences'),where('date','>=',iso(a)),where('date','<=',iso(b))),s=>{
    rdvs=s.docs.map(d=>({id:d.id,...d.data()})).filter(r=>!r.medecinId||r.medecinId===medecin.uid).sort((x,y)=>x.heure.localeCompare(y.heure));
    rendre();if(sel&&!$('#detail').contains(document.activeElement))ouvrir();
  },e=>console.error(e));
}

const applique=(a,d)=>{
  if(a.date && a.dateFin) return a.date<=d && d<=a.dateFin;
  if(a.date) return a.date===d;
  return (a.jours||[]).includes(new Date(d+'T00:00').getDay())&&(!a.depuis||d>=a.depuis)&&(!a.jusqu||d<=a.jusqu);
};
function ecouterAffectations(){
  if(unsubA)unsubA();
  unsubA=onSnapshot(query(collection(db,'affectations'),where('uid','==',medecin.uid)),s=>{affs=s.docs.map(d=>({id:d.id,...d.data()}));rendre()},e=>console.error(e));
  if(unsubE)unsubE();
  unsubE=onSnapshot(collection(db,'evenements'),s=>{
    allEvts=s.docs.map(d=>({id:d.id,...d.data()}));
    evts=allEvts.filter(e=>e.tous||(e.participants||[]).includes(medecin.uid));
    rendre();
  },e=>console.error(e));
}

const symsDe=r=>{const s=r.symptomes||{};return[...(s.liste||[]),...(s.autres||[])]}; // symptômes proposés + saisis par le patient
const demandeurDe=r=>{const d=r.demandeur;return r.pourQui==='proche'&&d?`${d.prenom||''} ${d.nom||''}${d.lien?' ('+d.lien+')':''}`.trim():''}; // personne qui a pris le rendez-vous pour le patient
function majEtat(){
  const n=new Date(),k=iso(n),m=n.getHours()*60+n.getMinutes(),a=affs.filter(x=>applique(x,k)&&tm(x.start)<=m&&m<tm(x.end)),c=a.find(x=>x.consultation),e=$('#etat');
  e.textContent=c?'En consultation · rendez-vous ouverts':a.length?(a[0].posteLabel||a[0].poste):'Aucune affectation en ce moment';
  e.className='etat '+(c?'cs':a.length?'oth':'');
}
setInterval(majEtat,60000);

function rendre(){
  const[a,b]=plage(),days=[],today=iso(new Date());
  for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))days.push(new Date(d));
  $('#titre').textContent=view==='day'?a.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):a.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' – '+b.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
  $('#legend').innerHTML=Object.keys(STAT).map(s=>`<button class="chip s-${s}" data-s="${s}" aria-pressed="${!hid.has(s)}">${STAT[s]} · ${rdvs.filter(r=>r.statut===s).length}</button>`).join('')
    +'<span class="chip" style="--c:#16784a;--bg:#e1f4e9">Consultation</span>'
    +'<span class="chip" style="--c:#6b3fc4;--bg:#ece5fb">Réunions</span>';
  const h0=0,h1=24,H=h1*PX;
  const cal=$('#cal');cal.style.gridTemplateColumns=`56px repeat(${days.length},minmax(${view==='day'?0:120}px,1fr))`;
  let h='<div class="gh"></div>'+days.map(d=>`<div class="gh ${iso(d)===today?'today':''}">${view==='day'?'':d.toLocaleDateString('fr-FR',{weekday:'short'})}<b>${d.getDate()}</b></div>`).join('');
  h+=`<div class="gut" style="height:${H}px">`+Array.from({length:h1-h0},(_,i)=>i?`<span style="top:${i*PX}px">${String(h0+i).padStart(2,'0')}:00</span>`:'').join('')+'</div>';
  const n=new Date(),nm=n.getHours()*60+n.getMinutes();
  for(const d of days){
    const k=iso(d),grp={};
    rdvs.filter(r=>r.date===k&&!hid.has(r.statut)).forEach(r=>(grp[r.heure]??=[]).push(r));
    h+=`<div class="col ${k===today?'today':''}" style="height:${H}px">`;
    h+=affs.filter(a=>applique(a,k)).map(a=>`<div class="aff ${a.consultation?'cs':''}" style="top:${(tm(a.start)-h0*60)/60*PX}px;height:${(tm(a.end)-tm(a.start))/60*PX}px">${esc(a.posteLabel||a.poste||'')} · ${esc(a.start)}–${esc(a.end)}</div>`).join('');
    h+=evts.filter(ev=>applique(ev,k)).map(ev=>{
      const ico=ev.mode==='distanciel'?'💻':(ev.mode==='hybride'?'💻📍':'📍');
      const mr=ev.responses&&ev.responses[medecin.uid],cl=mr==='non'?' non':((!mr&&ev.optResponse!==false&&ev.creePar!==medecin.uid)?' att':'');
      return `<button type="button" class="ev-srv${cl}" data-evid="${ev.id}" title="${esc(ev.titre)}" style="top:${(tm(ev.start)-h0*60)/60*PX}px;height:${Math.max(26,(tm(ev.end)-tm(ev.start))/60*PX-2)}px"><b>${esc(ev.start)}</b> ${ico} ${esc(ev.titre)}</button>`;
    }).join('');
    for(const hr in grp)grp[hr].forEach((r,i,arr)=>{
      const p=r.patient||{},top=(tm(hr)-h0*60)/60*PX;
      h+=`<button class="ev s-${r.statut}" data-id="${r.id}" ${r.id===sel?'aria-current="true"':''} title="${esc(hr+' · '+STAT[r.statut]+' · '+(p.prenom||'')+' '+(p.nom||'')+' · '+(r.motif||'')+' · '+symsDe(r).join(', ')+(r.statut==='annule'?' · Annulation : '+(r.motifAnnulation||'motif non renseigné'):''))}" style="top:${top}px;height:${Math.max(26,PX*(r.duree||DUR)/60-2)}px;left:${i*100/arr.length}%;width:calc(${100/arr.length}% - 2px)"><b>${esc(hr)}</b> ${r.statut==='annule'?'✕ ':''}${r.alerteVitale?'⚠ ':''}${demandeurDe(r)?'👤 ':''}<span class="nm">${esc(p.prenom)} ${esc(p.nom)}</span>${view==='day'?` <small>${esc([r.motif,...symsDe(r)].filter(Boolean).join(' · '))}</small>`:''}</button>`;
    });
    if(k===today&&nm>=h0*60&&nm<h1*60)h+=`<div class="now" style="top:${(nm-h0*60)/60*PX}px"></div>`;
    h+='</div>';
  }
  cal.innerHTML=h;majEtat();
  if(go){go=false;$('#wrap').scrollTop=Math.max(0,(days.some(d=>iso(d)===today)?nm-60:480)/60*PX)}
}

$('#cal').onclick=e=>{
  const srv=e.target.closest('.ev-srv');
  if(srv){sel=null;ouvrirEvenement(srv.dataset.evid);return}
  const b=e.target.closest('.ev');if(!b)return;
  sel=b.dataset.id;
  document.querySelectorAll('.ev').forEach(x=>x.setAttribute('aria-current',x===b));
  ouvrir();
};

/* ---- Fiche patient (même index que ajouterpatient.html) ---- */
function buildSearchIndex(nom,prenom,dn){
  const n=(nom||'').toLowerCase(),p=(prenom||'').toLowerCase(),idx=new Set();
  for(const w of [n,p])for(let i=1;i<=w.length;i++)idx.add(w.slice(0,i));
  idx.add(n+' '+p);idx.add(p+' '+n);
  const d=new Date(dn);
  if(dn&&!isNaN(d)){const j=String(d.getDate()).padStart(2,'0'),m=String(d.getMonth()+1).padStart(2,'0'),a=d.getFullYear();idx.add(`${j}${m}${a}`);idx.add(`${j}/${m}/${a}`);idx.add(String(a))}
  return [...idx];
}
async function candidats(p){
  const out=new Map(),d=new Date(p.dateNaissance),n=(p.nom||'').toLowerCase(),pr=(p.prenom||'').toLowerCase(),keys=[n+' '+pr,pr+' '+n];
  if(!isNaN(d))keys.push(`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`);
  for(const k of keys){try{(await getDocs(query(collection(db,'patients'),where('searchIndex','array-contains',k),limit(10)))).forEach(x=>out.set(x.id,{id:x.id,...x.data()}))}catch(e){}}
  return [...out.values()].sort((a,b)=>((b.dateNaissance===p.dateNaissance)-(a.dateNaissance===p.dateNaissance)));
}

/* ---- Consultation ---- */
const openConsult=(id,p)=>window.parent.postMessage({type:'OPEN_TAB',title:('Consultation '+(p.nom||'')+' '+(p.prenom||'')).trim(),url:'ficheconsultation.html?id='+encodeURIComponent(id)},'*');
async function creerConsultation(r,pid){
  const n=new Date();
  const ref=await addDoc(collection(db,'consultations'),{patientId:pid,rdvId:r.id,date:n.toLocaleDateString('fr-FR'),heure:n.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),dateTS:Timestamp.now(),
    motif:r.motif,histoire:[r.detail,symsDe(r).length?'Symptômes déclarés : '+symsDe(r).join(', '):'',r.symptomes?.depuis?'Depuis : '+r.symptomes.depuis:''].filter(Boolean).join('\n'),symptomes:r.symptomes||{},pourQui:r.pourQui||'moi',demandeur:r.demandeur||null,examenClinique:'',diagnostic:'',conduite:'',statut:'encours',
    medecinId:medecin.uid,medecinNom:medecin.nom||'',medecinSpecialite:medecin.specialite||'',origine:'rdv-urgences'});
  await updateDoc(doc(db,'patients',pid),{consultations:arrayUnion(ref.id)});
  await updateDoc(doc(db,'rdv-urgences',r.id),{patientId:pid,consultationId:ref.id,statut:'encours',medecinId:medecin.uid});
  return ref.id;
}

/* ---- Dossier du rendez-vous (clic sur un créneau) ---- */
async function ouvrir(){
  const r=rdvs.find(x=>x.id===sel),box=$('#detail');
  if(!r){box.hidden=true;return}
  const p=r.patient||{},sy=r.symptomes||{},arr=r.arriveLe?.toDate?r.arriveLe.toDate().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'';
  const F=(l,v)=>`<div class="fact"><label>${l}</label><span>${esc(v||'—')}</span></div>`;
  let h=`<div class="dh"><h2 class="card-title">${esc(p.prenom)} ${esc(p.nom)}</h2><button class="x" id="close" aria-label="Fermer">×</button></div><span class="pill s-${r.statut}">${STAT[r.statut]}</span>`+
    F('Créneau',new Date(r.date+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+' à '+r.heure+(r.ref?' · '+r.ref:''))+(r.alerteVitale?'<div class="note s-annule">⚠ Le patient a signalé des signes d’alerte.</div>':'')+F('Motif',r.motif+(r.detail?' — '+r.detail:''))+F('Symptômes',(sy.liste||[]).join(', '))+F('Symptômes ajoutés par le patient',(sy.autres||[]).join(', '))+F('Depuis',sy.depuis)+F('Douleur',sy.douleur?sy.douleur+'/10':'')+F('Fièvre',sy.fievre)+F('Signes d’alerte',(sy.signesAlerte||[]).join(', '))+(demandeurDe(r)?F('Rendez-vous pris par un tiers',demandeurDe(r))+F('Téléphone du demandeur',r.demandeur?.telephone):'')+F('Naissance',p.dateNaissance)+F('Téléphone',p.telephone)+F('E-mail',p.email);
  if(r.statut==='annule'){
    const qui={patient:'par le patient (en ligne)',accueil:'par l’accueil',medecin:'par le service'}[r.annulePar]||'';
    const quand=r.annuleLe?.toDate?r.annuleLe.toDate().toLocaleString('fr-FR',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}):'';
    h+=`<div class="raison">Rendez-vous annulé${qui?' '+qui:''}<br>Motif : ${esc(r.motifAnnulation||'non renseigné')}${r.precisionAnnulation?`<small>Précisions : ${esc(r.precisionAnnulation)}</small>`:''}${quand?`<small>Annulé le ${esc(quand)}</small>`:''}</div>`;
  }
  const actif=r.statut==='pris'||r.statut==='attente';
  if(r.statut==='pris')h+=`<h3>Fiche patient</h3><div id="fiche"><p class="mut">Recherche des fiches existantes…</p></div>`;
  else if(r.statut==='attente')h+=`<div class="note s-attente">En salle d’attente${arr?' depuis '+arr:''}.</div><button class="btn-primary" id="go">Démarrer la consultation</button>`;
  else if(r.consultationId)h+=`<button class="btn-primary" id="open">Ouvrir la consultation</button>`;
  if(actif)h+=`<button class="btn-danger" id="cancel">Annuler le rendez-vous</button>`;
  box.hidden=false;box.innerHTML=h;
  $('#close').onclick=()=>{sel=null;box.hidden=true;document.querySelectorAll('.ev').forEach(x=>x.setAttribute('aria-current','false'))};
  if($('#open'))$('#open').onclick=()=>openConsult(r.consultationId,p);
  const demarrer=async()=>{
    $('#go').disabled=true;
    try{
      let pid=r.patientId;const c=$('#fiche input[name=f]:checked');
      if(c){pid=c.value;if(pid==='new')pid=(await addDoc(collection(db,'patients'),{nom:(p.nom||'').toUpperCase(),prenom:p.prenom,sexe:p.sexe||'',civilite:'',dateNaissance:p.dateNaissance,adresse:p.adresse||'',telephone:p.telephone,email:p.email||'',
        hospitalisations:[],hospitalisationActiveId:null,hospitalisationActive:false,consultations:[],medtraitant:'',vigilances:'aucune',allergies:'aucun',searchIndex:buildSearchIndex((p.nom||'').toUpperCase(),p.prenom,p.dateNaissance)})).id}
      openConsult(await creerConsultation(r,pid),p);
    }catch(e){console.error(e);afficherBulle('Échec de la création de la consultation',BULLE.ERR);$('#go').disabled=false}
  };
  if($('#go'))$('#go').onclick=demarrer;
  if(r.statut==='pris'){
    const f=$('#fiche'),cands=await candidats(p);
    if(!f.isConnected)return;
    f.innerHTML=(cands.length?`<p class="mut">Fiches correspondantes trouvées :</p>`+cands.map((c,i)=>`<label class="choice ${i===0?'on':''}"><input type="radio" name="f" value="${c.id}" ${i===0?'checked':''}><span><b>${esc(c.nom)} ${esc(c.prenom)}</b><br><small class="mut">Né(e) le ${esc(c.dateNaissance||'—')} · ${esc(c.telephone||'—')} · CIP ${esc(c.id)}</small></span></label>`).join(''):'<p class="mut">Aucune fiche existante ne correspond.</p>')+
      `<label class="choice ${cands.length?'':'on'}"><input type="radio" name="f" value="new" ${cands.length?'':'checked'}><span><b>Créer une nouvelle fiche patient</b></span></label><button class="btn-primary" id="go">Démarrer la consultation</button>`;
    f.querySelectorAll('input[name=f]').forEach(i=>i.onchange=()=>f.querySelectorAll('.choice').forEach(c=>c.classList.toggle('on',c.querySelector('input').checked)));
    $('#go').onclick=demarrer;
  }
  if($('#cancel'))$('#cancel').onclick=async()=>{
    if(!confirm('Annuler ce rendez-vous ? Le créneau sera libéré.'))return;
    try{await runTransaction(db,async tx=>{
      const oref=doc(db,'rdv-occupation',r.date),o=await tx.get(oref);
      if(o.exists()){const d=o.data(),c=d.counts||{},md={...(d.med||{})};c[r.heure]=Math.max(0,(c[r.heure]||1)-1);if(r.medecinId)md[r.heure]=(md[r.heure]||[]).filter(u=>u!==r.medecinId);tx.update(oref,{counts:c,med:md})}
      tx.update(doc(db,'rdv-urgences',r.id),{statut:'annule',annuleLe:serverTimestamp(),annulePar:'medecin',motifAnnulation:'Annulé par le service'});
    });afficherBulle('Rendez-vous annulé',BULLE.OK)}catch(e){afficherBulle('Échec de l’annulation',BULLE.ERR)}
  };
}

function ouvrirEvenement(id){
  const ev=allEvts.find(x=>x.id===id),box=$('#detail');
  if(!ev){box.hidden=true;return}
  const rs=ev.responses||{},mine=rs[medecin.uid]||'attente',invite=ev.tous||(ev.participants||[]).includes(medecin.uid);
  const F=(l,v)=>`<div class="fact"><label>${l}</label><span>${esc(v||'—')}</span></div>`;
  const k0=premiereDate(ev),s0=tm(ev.start),e0=tm(ev.end);
  let h=`<div class="dh"><h2 class="card-title">${esc(ev.titre)}</h2><button class="x" id="closeEv" aria-label="Fermer">×</button></div>`
    +`<span class="pill" style="--c:#6b3fc4;--bg:#ece5fb">${esc(CATS_EV[ev.cat]||'Réunion')}</span>`
    +F('Quand',quand(ev))+F('Horaires',`${ev.start} – ${ev.end}`)+F('Modalité',MODES_EV[ev.mode]||ev.mode);
  if(ev.lieu)h+=F('Lieu',ev.lieu);
  if(ev.creeParNom)h+=F('Organisateur',ev.creeParNom);
  if(ev.description)h+=F('Ordre du jour',ev.description);
  if(ev.lien)h+=`<a class="btn-ev" href="${esc(ev.lien)}" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;text-decoration:none">Rejoindre la visio</a>`;

  // conflits personnels (autre réunion ou congé sur le même créneau)
  const conf=[];
  allEvts.forEach(o=>{if(o.id!==ev.id&&(o.tous||(o.participants||[]).includes(medecin.uid))&&(o.responses||{})[medecin.uid]!=='non'&&appliqueEv(o,k0)&&tm(o.start)<e0&&s0<tm(o.end))conf.push('Réunion « '+o.titre+' » '+o.start+'–'+o.end)});
  allAffs.forEach(a=>{if(a.uid===medecin.uid&&a.poste==='conge'&&appliqueEv(a,k0)&&tm(a.start)<e0&&s0<tm(a.end))conf.push('Repos / congé '+a.start+'–'+a.end)});
  if(invite&&conf.length)h+=`<div class="warn-c">⚠ Conflit d’agenda : ${esc(conf.join(' · '))}</div>`;

  if(invite&&ev.optResponse!==false){
    h+=`<div class="fact"><label>Votre réponse</label><div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">`
      +[['oui','Je participe'],['peut-etre','Peut-être'],['non','Refuser']].map(([v,l])=>`<button class="b ${mine===v?'on':''}" onclick="repondreEv('${ev.id}','${v}')">${l}</button>`).join('')+`</div></div>`;
  }
  const masque=ev.optMaskList&&ev.creePar!==medecin.uid&&!peutCreer();
  if(!masque){
    const c=resumeRSVP(ev);
    const ligne=(uid,tag)=>{const r=rs[uid],b=r==='oui'?'🟢':r==='non'?'🔴':r==='peut-etre'?'🟡':'⏳';return `<div style="font-size:13px;padding:2px 0">${b} ${esc(users.find(x=>x.uid===uid)?.nom||uid)}${tag?` <small class="mut">${tag}</small>`:''}</div>`};
    const m=ev.participantsMandatory||[],o=ev.participantsOptional||[];
    let list=ev.tous?'<div style="font-size:13px">Toute l’équipe</div>':m.map(u=>ligne(u,'')).join('')+o.map(u=>ligne(u,'facultatif')).join('');
    if(ev.creePar&&!m.includes(ev.creePar)&&!ev.tous)list=ligne(ev.creePar,'organisateur')+list;
    h+=`<div class="fact"><label>Invités</label><div class="rsvp-sum"><span>🟢 ${c.oui}</span><span>🟡 ${c.pe}</span><span>🔴 ${c.non}</span><span>⏳ ${c.att}</span></div><div style="margin-top:8px">${list||'—'}</div></div>`;
  }
  h+=`<button class="btn-sec" id="icsEv" style="display:none">📅 Ajouter à mon agenda (.ics)</button>`;
  if(peutCreer())h+=`<button class="btn-primary" onclick="modifierEv('${ev.id}')">Modifier / supprimer</button>`;
  box.hidden=false;box.innerHTML=h;
  $('#closeEv').onclick=()=>{box.hidden=true};
  $('#icsEv').onclick=()=>ics(ev);
}

window.repondreEv=async(evId,statut)=>{
  try{
    const ref=doc(db,'evenements',evId);
    await updateDoc(ref,{[`responses.${medecin.uid}`]:statut});
    afficherBulle('Réponse enregistrée',BULLE.OK);
    ouvrirEvenement(evId);
  }catch(e){console.error(e);afficherBulle('Échec',BULLE.ERR)}
};


/* ===== Moteur de réunions (droit pages.creerRDV) ===== */
const R=initReunions({
  db,
  getMe:()=>medecin,
  getUsers:()=>users,
  getAffs:()=>allAffs,
  getEvts:()=>allEvts,
  notify:afficherBulle,
  refresh:async()=>{allAffs=(await getDocs(collection(db,'affectations'))).docs.map(d=>d.data())}
});
const peutCreer=()=>medecin.pages?.creerRDV===true;
window.modifierEv=id=>{const ev=allEvts.find(x=>x.id===id);if(ev)R.ouvrir(ev)};
$('#bNewEv').onclick=()=>R.ouvrir(null,{date:iso(anchor)});

/* Ouverture demandée depuis le widget d'accueil (shell) */
function demandeWidget(){
  if(!medecin.uid||!localStorage.getItem('gu_new_rdv'))return;
  localStorage.removeItem('gu_new_rdv');
  if(peutCreer())R.ouvrir(null,{date:iso(new Date())});
}
addEventListener('storage',e=>{if(e.key==='gu_new_rdv')demandeWidget()});
setTimeout(demandeWidget,800);
</script>
